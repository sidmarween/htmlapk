name: Build APK

on:
  push:
    branches: ['**']   # keine Tags – die temporären AAB-Releases sollen keinen Build auslösen
    paths-ignore:
      - '.github/workflows/aab.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Tests der Kernlogik
        run: |
          set -o pipefail
          gradle :builder:testDebugUnitTest --stacktrace 2>&1 | tee -a build-log.txt

      - name: Testweise erzeugte App mit den offiziellen Tools prüfen
        run: |
          set -o pipefail
          {
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/aapt2" dump badging builder/build/test-output/sample.apk | head -6
            "$BT/apksigner" verify --verbose builder/build/test-output/sample.apk
            "$BT/zipalign" -c -p 4 builder/build/test-output/sample.apk && echo "zipalign OK"
          } 2>&1 | tee -a build-log.txt

      - name: AAB-Umwandlung testen (wie im Workflow „APK zu AAB“)
        run: |
          set -o pipefail
          curl -sSfL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            bash scripts/apk2aab.sh builder/build/test-output/sample.apk sample.aab "$BT/aapt2" bundletool.jar
            java -jar bundletool.jar validate --bundle=sample.aab | head -8
            java -jar bundletool.jar build-apks --bundle=sample.aab --output=sample.apks --mode=universal
            unzip -o -q sample.apks universal.apk
            "$BT/aapt2" dump badging universal.apk | head -3
          } 2>&1 | tee -a build-log.txt

      - name: Release-Schlüssel prüfen (zeigt nie das Passwort)
        env:
          PW_SECRET: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PW_VAR_SET: ${{ vars.RELEASE_KEY_PASSWORD != '' }}
        run: |
          if [ -n "$PW_SECRET" ]; then
            echo "Secret RELEASE_KEY_PASSWORD: gefunden (${#PW_SECRET} Zeichen)"
            if keytool -list -keystore signing/release.p12 -storetype PKCS12 -storepass "$PW_SECRET" >/dev/null 2>&1; then
              echo "Passwort passt zum Schlüssel"
            else
              echo "::error title=Release-Schlüssel::Das Secret ist gesetzt, aber das Passwort passt nicht (Tippfehler oder Leerzeichen?)."
            fi
          else
            echo "::warning title=Release-Schlüssel::Secret RELEASE_KEY_PASSWORD nicht gefunden."
          fi
          if [ "$PW_VAR_SET" = "true" ]; then
            echo "::warning title=Release-Schlüssel::RELEASE_KEY_PASSWORD ist als *Variable* angelegt (öffentlich lesbar!). Bitte löschen und als *Secret* anlegen."
          fi

      - name: Builder-App bauen (enthält die Vorlage)
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "HAS_RELEASE_KEY=1" >> "$GITHUB_ENV"
          else
            echo "::warning title=Kein Release-Schlüssel::Secret RELEASE_KEY_PASSWORD fehlt – Test-Signatur, es wird nichts veröffentlicht."
          fi
          gradle :builder:assembleRelease --stacktrace 2>&1 | tee -a build-log.txt
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs builder/build/outputs/apk/release/builder-release.apk | head -3

      - name: Vorlage prüfen
        run: |
          unzip -l template/build/outputs/apk/release/template-release-unsigned.apk
          unzip -l builder/build/outputs/apk/release/builder-release.apk | grep template.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HtmlApkBuilder
          path: |
            builder/build/outputs/apk/release/builder-release.apk
            builder/build/test-output/sample.apk

      - name: Als Release veröffentlichen
        if: github.ref == 'refs/heads/main' && env.HAS_RELEASE_KEY == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp builder/build/outputs/apk/release/builder-release.apk HtmlApkBuilder.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HtmlApkBuilder.apk \
            --title "HTML APK Builder (neuester Build)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. HtmlApkBuilder.apk herunterladen und auf dem Handy installieren."

      # Fehler als Hinweis ausgeben, damit sie auch ohne Log-Download lesbar sind
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          touch build-log.txt
          for x in builder/build/test-results/*/*.xml; do
            [ -f "$x" ] && grep -A15 "<failure" "$x" >> build-log.txt || true
          done
          msg=$(grep -E -B2 -A12 "What went wrong|FAILED|error:|Exception|AssertionError|<failure" build-log.txt | head -120 | cut -c1-300)
          [ -z "$msg" ] && msg=$(tail -60 build-log.txt)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\r'/'%0D'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Build-Fehler::${msg:0:12000}"

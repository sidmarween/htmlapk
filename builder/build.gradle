plugins {
    id 'com.android.application'
}

// Fertige, unsignierte Vorlagen-APK aus dem Modul :template
ext.templateApkFile = project(':template').layout.buildDirectory
        .file('outputs/apk/release/template-release-unsigned.apk')

android {
    namespace 'de.htmlapk.builder'
    compileSdk 35

    defaultConfig {
        applicationId 'de.htmlapk.builder'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '3.3'
    }

    // Release-Signatur: Der Schlüssel liegt verschlüsselt in signing/release.p12,
    // das Passwort kommt aus dem GitHub-Secret RELEASE_KEY_PASSWORD (Umgebungsvariable).
    // Ohne Passwort (z. B. in Forks) wird mit einem einmaligen Test-Schlüssel signiert
    // und der Workflow veröffentlicht nichts.
    def releasePassword = System.getenv('RELEASE_KEY_PASSWORD')
    def hasReleaseKey = releasePassword != null && !releasePassword.isEmpty()
            && rootProject.file('signing/release.p12').exists()
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile rootProject.file('signing/release.p12')
                storeType 'PKCS12'
                storePassword releasePassword
                keyAlias 'htmlapkbuilder'
                keyPassword releasePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['META-INF/*.version', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.all {
            dependsOn ':template:assembleRelease'
            systemProperty 'templateApk', templateApkFile.get().asFile.absolutePath
            systemProperty 'testOut', layout.buildDirectory.dir('test-output').get().asFile.absolutePath
        }
    }
}

dependencies {
    implementation 'com.android.tools.build:apksig:8.5.2'
    testImplementation 'junit:junit:4.13.2'
}

// ---------------------------------------------------------------------------
// Die Vorlagen-APK (Modul :template) wird gebaut und als assets/template.apk
// in die Builder-App gepackt.
// ---------------------------------------------------------------------------

abstract class CopyTemplateApk extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getTemplateApk()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copy() {
        def out = outputDir.get().file('template.apk').asFile
        out.parentFile.mkdirs()
        out.bytes = templateApk.get().asFile.bytes
    }
}

def copyTemplateApk = tasks.register('copyTemplateApk', CopyTemplateApk) {
    dependsOn ':template:assembleRelease'
    templateApk.set(templateApkFile)
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(copyTemplateApk, CopyTemplateApk::getOutputDir)
    }
}

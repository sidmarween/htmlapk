plugins {
    id 'com.android.application'
}

// Diese App wird nie direkt installiert. Sie ist die "Hülle", die der Builder
// auf dem Handy mit HTML-Dateien, Name, Paketname und Icon befüllt.
// Wichtig: keine AndroidX-Bibliotheken, sonst entstehen Provider/Berechtigungen
// mit dem Paketnamen, die der Builder nicht umbenennen würde.
android {
    namespace 'de.htmlapk.runtime'
    compileSdk 35

    defaultConfig {
        applicationId 'com.htmlapk.placeholder.app'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
